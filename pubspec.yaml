name: narcoquest
description: NarcoQuest – Tagebuch für Menschen mit Narkolepsie (Schlaf, Naps, Symptome, Zyklus, Wecker mit Aufgaben).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  alarm: ^5.15.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  permission_handler: ^12.0.2
  path_provider: ^2.1.5
  share_plus: ^13.0.0
  file_picker: ^13.3.3
  pdf: ^3.11.0
  cryptography: ^2.7.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
